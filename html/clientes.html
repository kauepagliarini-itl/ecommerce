<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Lindos | Clientes</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <!-- AOS.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css" />

  <!-- CSS do projeto -->
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light">

  <div class="d-flex min-vh-100">

    <!-- Sidebar -->
    <aside class="sidebar bg-dark text-white p-3">
      <div class="mb-4">
        <h1 class="h4 mb-1">E-Commerce</h1>
        <p class="small text-white-50 mb-0">Sistema de Gestão da Loja</p>
      </div>

      <nav class="nav flex-column gap-2">
        <a class="nav-link text-white-50" href="index.html">
          <i class="fa-solid fa-chart-line me-2"></i>Dashboard
        </a>
        <a class="nav-link active text-white" href="clientes.html">
          <i class="fa-solid fa-users me-2"></i>Clientes
        </a>
        <a class="nav-link text-white-50" href="produtos.html">
          <i class="fa-solid fa-shirt me-2"></i>Produtos
        </a>
        <a class="nav-link text-white-50" href="pedidos.html">
          <i class="fa-solid fa-receipt me-2"></i>Pedidos
        </a>
      </nav>
    </aside>

    <!-- Conteúdo principal -->
    <main class="flex-grow-1 p-4">

      <!-- Topbar: breadcrumb + data atual -->
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 topbar">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><i class="fa-solid fa-house-chimney me-1"></i>Início</li>
            <li class="breadcrumb-item active" aria-current="page">Clientes</li>
          </ol>
        </nav>
        <span class="text-muted small" id="dataAtualTopbar"></span>
      </div>

      <!-- Cabeçalho -->
      <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4" data-aos="fade-down">
        <div>
          <h2 class="h3 mb-1">Clientes</h2>
          <p class="text-muted mb-0">Cadastro e edição de clientes</p>
        </div>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCliente" id="btnNovoCliente">
          <i class="fa-solid fa-user-plus me-2"></i>Novo cliente
        </button>
      </header>

      <!-- Busca e Filtro por Situação -->
      <section class="card shadow-sm border-0 mb-4" data-aos="fade-up">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-md-5">
              <label for="campoBuscaCliente" class="form-label">Buscar cliente</label>
              <input
                type="text"
                class="form-control"
                id="campoBuscaCliente"
                placeholder="Digite nome, e-mail, CPF ou endereço..."
              />
            </div>
            <div class="col-12 col-md-3">
              <label for="filtroSituacaoCliente" class="form-label">Filtrar por situação</label>
              <select class="form-select" id="filtroSituacaoCliente">
                <option value="">Todos</option>
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
              </select>
            </div>
            <div class="col-12 col-md-4 text-md-end">
              <p class="text-muted mb-0">
                Total de clientes: <strong id="totalClientesPagina">0</strong>
              </p>
            </div>
          </div>
        </div>
      </section>

      <!-- Tabela -->
      <section class="card shadow-sm border-0" data-aos="fade-up">
        <div class="card-header bg-white border-0 pt-3">
          <h3 class="h5 mb-0">Lista de clientes</h3>
        </div>

        <div class="card-body table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Nome</th>
                <th>CPF</th>
                <th>Endereço</th>
                <th>Situação</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaClientes">
              <!-- JS vai preencher -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal Cliente -->
  <div class="modal fade" id="modalCliente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="formCliente">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalCliente">Novo cliente</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="clienteId" />

            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="nomeCliente" class="form-label">Nome completo *</label>
                <input type="text" class="form-control" id="nomeCliente" required />
              </div>

              <div class="col-12 col-md-6">
                <label for="cpfCliente" class="form-label">CPF *</label>
                <input
                  type="text"
                  class="form-control"
                  id="cpfCliente"
                  placeholder="000.000.000-00"
                  maxlength="14"
                  required
                />
                <small class="text-muted">Digite apenas números - a máscara é aplicada automaticamente.</small>
              </div>

              <div class="col-12 col-md-6">
                <label for="emailCliente" class="form-label">E-mail *</label>
                <input type="email" class="form-control" id="emailCliente" required />
              </div>

              <div class="col-12 col-md-6">
                <label for="enderecoCliente" class="form-label">Endereço *</label>
                <input type="text" class="form-control" id="enderecoCliente" required />
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="btnSalvarCliente">
              Salvar cliente
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- AOS.js -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 500, once: true });
    document.getElementById("dataAtualTopbar").textContent =
      new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
  </script>

  <!-- JS da página -->
  <script src="../js/clientes.js"></script>
</body>
</html>
